name: release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: rift-release-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      ASSET_BASENAME: rift-universal-macos
      TAP_REPO: acsandmann/homebrew-tap
      TAP_FILE_PATH: Formula/rift.rb
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Verify tag matches root package version
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]/{package=1; next} /^\[/{package=0}
            package && /^version[[:space:]]*=/{split($0, value, "\""); print value[2]; exit}' Cargo.toml)
          test -n "$version"
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "Release tag does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Install Rust + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Show toolchain
        run: |
          rustc -V
          cargo -V
          rustup target list --installed
          sw_vers

      - name: Build release for both targets (both bins)
        run: |
          set -euxo pipefail
          # Build arm64
          cargo build --release --locked --package rift-wm --bin rift --bin rift-cli --target aarch64-apple-darwin
          # Build x86_64
          cargo build --release --locked --package rift-wm --bin rift --bin rift-cli --target x86_64-apple-darwin

      - name: Create universal binaries with lipo
        run: |
          set -euxo pipefail
          mkdir -p dist

          # Combine rift
          lipo -create \
            target/aarch64-apple-darwin/release/rift \
            target/x86_64-apple-darwin/release/rift \
            -output dist/rift

          # Combine rift-cli
          lipo -create \
            target/aarch64-apple-darwin/release/rift-cli \
            target/x86_64-apple-darwin/release/rift-cli \
            -output dist/rift-cli

          # Optional: strip symbols to reduce size
          strip -x dist/rift dist/rift-cli

      - name: Package tarball
        id: pkg
        run: |
          set -euxo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"            # strip leading 'v' if present
          ASSET="${ASSET_BASENAME}-${VERSION}.tar.gz"

          test -s rift.default.toml
          cp rift.default.toml dist/rift.default.toml
          tar -C dist -czf "${ASSET}" rift rift-cli rift.default.toml
          sha256=$(shasum -a 256 "${ASSET}" | awk '{print $1}')

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Check packaged binary versions
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          test "$(dist/rift --version)" = "rift ${VERSION}"
          test "$(dist/rift-cli --version)" = "rift-cli ${VERSION}"
          test -s dist/rift.default.toml

      - name: Upload asset to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.pkg.outputs.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }} # PAT with repo:push to the tap

      - name: Update formula URL, version & sha256
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        run: |
          set -euo pipefail
          FORMULA="tap/${TAP_FILE_PATH}"
          export ASSET_URL="https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}"
          # Only replace stable fields; preserve any development head block.
          awk '
            /^[[:space:]]*head[[:space:]]+do/ { head=1 }
            !head && /^  url[[:space:]]+"/ {
              print "  url \"" ENVIRON["ASSET_URL"] "\""
              print "  version \"" ENVIRON["VERSION"] "\""
              urls++; next
            }
            !head && /^  version[[:space:]]+"/ { next }
            !head && /^  sha256[[:space:]]+"/ {
              print "  sha256 \"" ENVIRON["SHA256"] "\""
              hashes++; next
            }
            { print }
            END { if (urls != 1 || hashes != 1) exit 1 }
          ' "$FORMULA" > "${FORMULA}.tmp"
          mv "${FORMULA}.tmp" "$FORMULA"
          ruby -c "$FORMULA"

      - name: Commit & push formula update
        run: |
          set -euxo pipefail
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add "${TAP_FILE_PATH}"
          if git -C tap diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git -C tap commit -m "chore(formula): rift ${{ steps.pkg.outputs.version }} (universal) - sha256 ${{ steps.pkg.outputs.sha256 }}"
          git -C tap push origin HEAD

  update-nix:
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      no_commit_sha: ${{ steps.no_commit.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Find universal binary release asset
        id: find_asset
        run: |
          ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq '.assets[].name')
          BINARY=$(echo "$ASSETS" | grep -i "universal" | head -1)
          if [ -z "$BINARY" ]; then
            echo "No universal binary found in release assets"
            exit 1
          fi
          echo "binary=${BINARY}" >> "$GITHUB_OUTPUT"
          echo "Found binary: ${BINARY}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download and calculate hash
        id: hash
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.find_asset.outputs.binary }}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          HASH=$(nix-prefetch-url --type sha256 --unpack "${DOWNLOAD_URL}")
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Calculated hash: ${HASH}"

      - name: Update package.nix
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BINARY="${{ steps.find_asset.outputs.binary }}"
          HASH="${{ steps.hash.outputs.hash }}"

          sed -i "s|version = \"[^\"]*\"|version = \"${VERSION}\"|g" nix/package.nix
          sed -i "s|url = \"https://github.com/acsandmann/rift/releases/download/v[^/]*/[^\"]*\"|url = \"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${BINARY}\"|g" nix/package.nix
          sed -i "s|sha256 = \"[^\"]*\"|sha256 = \"${HASH}\"|g" nix/package.nix

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet nix/package.nix; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            nix flake update
          fi

      - name: Commit package updates
        if: steps.check_changes.outputs.has_changes == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/package.nix flake.lock
          git commit -m "chore(nix): update rift-bin package after release ${{ github.ref_name }}"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Output commit SHA (no changes case)
        if: steps.check_changes.outputs.has_changes == 'false'
        id: no_commit
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
